# Example bunny configuration.
#
# Copy this to ~/.config/bunny/config.yaml (or $BUNNY_HOME/config.yaml under a
# single-root install) and uncomment what you need. Every setting is optional,
# and copying the file as-is changes nothing until you uncomment something.
#
# Reference: docs/config.md

# --- Where packages are installed ------------------------------------------
#
# Each kind of package has its own root: sdk for anything another tool may need
# a path to, cli for plain commands, app for GUI applications. Defaults are
# ~/.local/share/bunny/{sdk,cli,app}.
#
# Worth setting "sdk" if you select JDK, Maven, or Gradle homes from an IDE's
# file picker: ~/opt/jdk-21 beats ~/.local/share/bunny/sdk/jdk-21 in a chooser.
# A leading ~/ is expanded; anything else must be an absolute path.

# install:
#   sdk: ~/opt

# --- Extra environment at launch -------------------------------------------
#
# Keyed by package id ("node-22"), capability ("node"), or "*" for everything,
# matched least specific first so a later match wins. Values expand the same
# placeholders manifests use: {app} the install tree, {data} the package's own
# data dir, {home} your real $HOME.
#
# This is where per-version data isolation lives. Bunny ships none of it: by
# default mvn fills ~/.m2, gradle uses ~/.gradle, npm caches in ~/.npm.

# env:
#   "*":
#     LANG: C.UTF-8
#   node:
#     NPM_CONFIG_PREFIX: "{data}/npm-global"   # globals per Node version
#     NPM_CONFIG_CACHE: "{data}/npm-cache"     # downloads outside an app sandbox's HOME
#   node-22:
#     NODE_OPTIONS: "--max-old-space-size=8192"
#   gradle:
#     GRADLE_USER_HOME: "{data}/gradle"        # see the caveat in docs/config.md
#   maven:
#     # MAVEN_ARGS is one variable doing two jobs, so an override has to
#     # restate the toolchains flag bunny's manifest sets.
#     MAVEN_ARGS: "-Dmaven.repo.local={data}/repository --toolchains {data}/toolchains.xml"

# --- Directories to create before launch ------------------------------------
#
# Keyed like env. Rarely needed: most tools create their own. Reach for it when
# a tool expects its target to exist, or when the path is buried inside a
# compound variable bunny cannot parse.

# dirs:
#   maven:
#     - "{data}/repository"

# --- Sandbox ------------------------------------------------------------
#
# Runtime sandboxing is opt-in per package: presence under packages activates
# it. Manifest recommendations, a selected profile, and the package entry are
# merged; no manifest or global setting can activate every package. See
# docs/sandbox.md. Built-ins: desktop, online-cli, offline-cli.

# sandbox:
#   packages:
#     code:
#       activation: on-demand # omit for always
#       profile: desktop
#       features:
#         audio: false
#       hide:
#         - ~/Documents/private
#     codex:
#       activation: on-demand
#       profile: online-cli

# --- Catalogs ---------------------------------------------------------------
#
# Where manifests come from, highest priority first. Each entry needs a name
# and exactly one of local, a checkout on disk, or remote, an HTTP catalog. The
# first catalog listed that carries a package serves it. The list is exhaustive:
# with none listed the chain is the public catalog alone, so name it too when
# you list your own. See docs/config.md#catalogs.
#
# Your own packages beside the public ones, without forking:

# catalogs:
#   - name: acme
#     local: ~/src/acme-catalog
#   - name: bunny
#     remote: https://raw.githubusercontent.com/cristatus/bunny-catalog/main
